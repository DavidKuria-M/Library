<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./style.css" rel="stylesheet">
    <script src="./script.js" defer></script>
    <title>Library</title>
</head>

<body>

    <header class="header">
        <div class="logo-container">
            <img src="./resources/library.png" alt="Book icon" class="logo-icon">
            <div>
                <h1>My Library</h1>
                <p>Keep track of the books you read and want to read.</p>
            </div>
        </div>

    </header>

    <main class="main-content">
        <div class="library-header">
            <h2>My Books</h2>
            <p id="library-count">You have 0 books in your library.</p>
        </div>

        <div id="books-container" class="book-grid">
            <!--Dynamic book cards-->

            <div class="add-book">
                <button id="add-book-btn">+</button>
                <h3>Add a New Book</h3>
                <p>Click the button above to add a book to your library</p>
            </div>
        </div>


    </main>





    <footer class="footer">
        <p><img class="fa-solid fa-book" src="./resources/menu.png" alt="Book icon">A good book is a good friend.</p>
    </footer>
</body>

</html>
